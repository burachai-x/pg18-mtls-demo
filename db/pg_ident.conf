# MAPNAME  SYSTEM-USERNAME  PG-USERNAME
#
# Intentionally empty. Authentication is scram-sha-256 + clientcert=verify-full,
# which requires the certificate CN to equal the database role name, and the
# "map" option cannot be combined with password methods. The roles are therefore
# named after the CNs directly: webapp (portal) and apiapp (API), both members
# of the privilege-holding role appuser — see db/init-user.sh.
