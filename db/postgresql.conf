# PostgreSQL 18 config for mTLS demo
# Minimal overrides — the official postgres:18 image already has sensible defaults.

# SSL
ssl = on
ssl_ca_file = '/var/lib/postgresql/certs-runtime/ca.crt'
ssl_cert_file = '/var/lib/postgresql/certs-runtime/server.crt'
ssl_key_file = '/var/lib/postgresql/certs-runtime/server.key'

# Auth
password_encryption = scram-sha-256

# Listen on all interfaces so the web container can connect
listen_addresses = '*'

# Logging — show SSL connection info
log_connections = on
log_line_prefix = '%m [%p] %u@%d %h '
