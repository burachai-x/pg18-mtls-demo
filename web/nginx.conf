# HTTP — redirect to HTTPS (use fixed host, not $host, to prevent open redirect)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;
    # The redirect target depends on the published HTTPS port, so the entrypoint
    # writes it to a writable volume (rootfs is read-only). Fixed host, not
    # $host, to prevent an open redirect.
    include /run/nginx-conf/redirect.conf;
}

# HTTPS — main server (TLS 1.3 only + PQC hybrid key exchange)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # TLS 1.2 + 1.3 (PQC hybrid key exchange ใช้ได้เฉพาะ TLS 1.3)
    ssl_protocols       TLSv1.2 TLSv1.3;

    # PQC hybrid key exchange: X25519MLKEM768 (post-quantum) + classical fallback
    ssl_ecdh_curve      X25519MLKEM768:X25519:prime256v1;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: blob:; font-src 'self' https://cdn.tailwindcss.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-DNS-Prefetch-Control "off" always;

    # Hide nginx version
    server_tokens off;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 12M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # REST API — handled by the separate 'api' service, not by this container.
    # The portal reverse-proxies over TLS (cert issued by the demo CA, CN=api)
    # so api-test.php keeps working same-origin. Clients may also call the API
    # container directly on its own published port.
    location ~ ^/api\.php(/.*)?$ {
        proxy_pass https://api:443;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name api;
        proxy_ssl_trusted_certificate /etc/postgresql-certs/ca.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param QUERY_STRING $query_string;
        # Hide PHP version
        fastcgi_param PHP_VALUE "expose_php=Off";
        fastcgi_hide_header X-Powered-By;
    }

    # Block garage-init.php — CLI-only script, must not be accessible via web
    location = /garage-init.php {
        deny all;
        return 403;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1h;
        access_log off;
    }
}

# S3 reverse proxy (TLS to garage-tls sidecar)
# PHP ต่อผ่าน nginx แทน Garage ตรง เพื่อรวม entry point + คุม access ได้
# SSE-C key is sent as HTTP header — TLS between web nginx and garage-tls encrypts it.
# Garage itself listens on Unix socket (no TCP port), accessible only via garage-tls sidecar.
server {
    listen 3901 default_server;
    server_name _;

    client_max_body_size 12M;

    location / {
        proxy_pass https://garage-tls:443;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name garage-tls;
        proxy_ssl_trusted_certificate /etc/nginx/garage-ca/ca.crt;
        # Keep Host: garage:3900 — AWS SigV4 signature uses this host
        proxy_set_header Host garage:3900;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers on;
        proxy_http_version 1.1;
    }
}
