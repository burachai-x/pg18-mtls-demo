# API APP — HTTPS only. No HTTP listener, no static files, no UI pages.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Server cert is issued by the demo CA (CN=api) so the web portal can
    # reverse-proxy to it with proxy_ssl_verify on.
    ssl_certificate     /etc/api-certs/server.crt;
    ssl_certificate_key /etc/api-certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ecdh_curve      X25519MLKEM768:X25519:prime256v1;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    server_tokens off;

    root /var/www/html;

    client_max_body_size 1M;

    # Liveness probe — no DB access, used by compose healthcheck
    location = /health {
        access_log off;
        add_header Content-Type application/json always;
        return 200 '{"status":"ok","service":"api"}';
    }

    # REST API — /api.php/users[/{id}]
    location ~ ^/api\.php(/.*)?$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "expose_php=Off";
        fastcgi_hide_header X-Powered-By;
    }

    # Convenience alias: /users → /api.php/users (same handler)
    location ~ ^/users(/.*)?$ {
        rewrite ^/users(/.*)?$ /api.php/users$1 last;
    }

    # Everything else is refused — this container serves the API only
    location / {
        default_type application/json;
        return 404 '{"error":"Not found — this service only serves /api.php/*"}';
    }
}
