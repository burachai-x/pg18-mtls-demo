# TYPE  DATABASE  USER      ADDRESS     METHOD           OPTIONS
# Two factors on every TCP connection:
#   1. a client certificate issued by the demo CA, whose CN must equal the
#      requested role name (clientcert=verify-full)
#   2. that role's SCRAM-SHA-256 password
# Note: the "map" option is not allowed with scram-sha-256, so each app logs in
# as a role named after its certificate CN (webapp / apiapp) instead of sharing
# one role through pg_ident.conf.
hostssl  all       all       all         scram-sha-256    clientcert=verify-full
# Reject non-SSL connections
hostnossl all      all       all         reject

# Local socket connections (for init scripts)
local   all       all                     trust
