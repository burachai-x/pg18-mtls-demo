services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: pg18-demo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
      PGCRYPTO_KEY: ${PGCRYPTO_KEY}
    # No host port publishing — DB is internal only (web connects via Docker network)
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/certs:/var/lib/postgresql/certs:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/init-user.sh:/docker-entrypoint-initdb.d/00-init-user.sh:ro
      - ./db/entrypoint-wrapper.sh:/usr/local/bin/entrypoint-wrapper.sh:ro
    entrypoint: [ "/usr/local/bin/entrypoint-wrapper.sh" ]
    command: >
      postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf -c ident_file=/etc/postgresql/pg_ident.conf
    healthcheck:
      # Probe over TCP, not the local socket: during first-time init the entrypoint
      # runs PostgreSQL with listen_addresses off, so a local-socket probe reports
      # healthy while web/api still get "connection refused" on 5432.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    # Use tini as PID 1 to reap zombie processes (runuser doesn't reap children)
    init: true
    # Container hardening
    read_only: false # PG needs writable data dir
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pg18-demo-web
    ports:
      # Standard web ports, matching the reference architecture.
      # Override HTTP_PORT/HTTPS_PORT in .env if 80/443 are taken on the host.
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      - "[::1]:${HTTP_PORT:-80}:80"
      - "[::1]:${HTTPS_PORT:-443}:443"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      S3_ENDPOINT: http://127.0.0.1:3901
      # Where the HTTP listener should redirect to (matches the published port)
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
      S3_REGION: garage
      S3_BUCKET: app-files
      # Secrets from env vars — not stored in DB
      PGCRYPTO_KEY: ${PGCRYPTO_KEY}
      REVEAL_PASSWORD: ${REVEAL_PASSWORD}
      SETTINGS_ADMIN_PASSWORD: ${SETTINGS_ADMIN_PASSWORD}
      S3_SSE_C_KEY: ${S3_SSE_C_KEY}
    volumes:
      - garagedata:/var/lib/garage:ro
      # Mount client certs as read-only volume instead of baking into image
      - ./web/certs:/etc/postgresql-certs:ro
      # Writable tmp for PHP sessions, nginx SSL cert generation, and client certs
      - webtmp:/tmp
      - webrun:/run
      - webssl:/etc/nginx/ssl
      - webnginxtmp:/var/lib/nginx
      - webnginxlogs:/var/log/nginx
      # Garage TLS sidecar CA cert for verifying garage-tls upstream
      - ./garage/tls/certs/ca.crt:/etc/nginx/garage-ca/ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
      garage-tls:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped
    # Container hardening:
    # - rootfs read-only, no-new-privileges, cap_drop ALL
    # - 5 caps retained (CHOWN/SETUID/SETGID/DAC_OVERRIDE/FOWNER) for entrypoint
    # - Root master processes (nginx/php-fpm) are an architectural hardening gap,
    #   not a direct vulnerability: all request workers run as nginx/www-data,
    #   rootfs is read-only, and no-new-privileges prevents escalation.
    # - For production: use nginx unprivileged image + php-fpm socket, or sidecar pattern
    sysctls:
      # Bind :80/:443 inside the container without granting NET_BIND_SERVICE
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # CHOWN/SETUID/SETGID: needed by entrypoint to chown files and su-exec to www-data
      # DAC_OVERRIDE/FOWNER: needed to override permissions during startup
      # NET_BIND_SERVICE not needed — ip_unprivileged_port_start=0 covers :80/:443
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    networks:
      - frontend
      - backend

  api:
    # API APP — its own container, image and DB identity (client cert CN=apiapp).
    # Serves only /api.php over TLS; no UI pages and no object-storage access.
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: pg18-demo-api
    ports:
      # The portal owns 443 on the host, so the API is published on API_PORT
      - "127.0.0.1:${API_PORT:-8443}:443"
      - "[::1]:${API_PORT:-8443}:443"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      # Own cert directory — the API authenticates to PostgreSQL as CN=apiapp
      PG_CERT_DIR: /tmp/api-pg-certs
      PGCRYPTO_KEY: ${PGCRYPTO_KEY}
    volumes:
      - ./api/certs:/etc/api-certs:ro
      # /tmp is shared with the web portal on purpose: the pgcrypto key lives in
      # /tmp/.crypto_key and key rotation in the portal must reach this service
      # too (stands in for a KMS in this demo). Cert and session dirs are separate.
      - webtmp:/tmp
      - apirun:/run
      - apinginxtmp:/var/lib/nginx
      - apinginxlogs:/var/log/nginx
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "php -r '$$c=@fsockopen(\"127.0.0.1\", 443); exit($$c ? 0 : 1);'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Container hardening (same posture as web)
    sysctls:
      # Bind :443 inside the container without granting NET_BIND_SERVICE
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    networks:
      # frontend: published port for direct API clients
      # backend:  mTLS connection to PostgreSQL
      - frontend
      - backend

  garage:
    # Pinned by SHA256 digest for supply chain integrity.
    # NOTE: Docker Scout reports 0 packages for this image — it is a blind spot,
    # not proof of safety. The image is a minimal Rust binary with no package manager.
    # Monitor upstream advisories: https://git.deuxfleurs.fr/deuxfleurs/garage
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    container_name: pg18-demo-garage
    # No host port publishing — S3 API is via Unix socket, not TCP
    expose:
      - "3903"
    volumes:
      - garagedata:/var/lib/garage
      - garagerun:/run/garage
      - ./garage/garage.toml:/etc/garage.toml:ro
    environment:
      RUST_LOG: garage=info
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    restart: unless-stopped
    # Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  garage-tls:
    # TLS termination sidecar for Garage S3 API.
    # Garage listens on Unix socket; this nginx terminates TLS on :443 — the
    # object-storage port in the reference architecture. Not published to the
    # host: only the web portal reaches it, over the internal backend network.
    # Web nginx connects via HTTPS with proxy_ssl_verify — SSE-C key is encrypted in transit.
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:44e36330f74d4f3a1d4e222acca9e23b401fb87811a7597024502bb759c4dd49
    container_name: pg18-demo-garage-tls
    user: "1000:1000"
    depends_on:
      - garage
    volumes:
      - garagerun:/run/garage:ro
      - ./garage/tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./garage/tls/certs/server.crt:/etc/nginx/tls/server.crt:ro
      - ./garage/tls/certs/server.key:/etc/nginx/tls/server.key:ro
    expose:
      - "443"
    read_only: true
    sysctls:
      # nginx runs as uid 1000 here — allow it to bind :443
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  garage-init:
    build:
      context: ./garage
      dockerfile: Dockerfile.init
    container_name: pg18-demo-garage-init
    depends_on:
      - garage
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
    volumes:
      - garagedata:/var/lib/garage
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ./garage/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: [ "/bin/sh", "/init-bucket.sh" ]
    restart: "no"
    # Container hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

volumes:
  pgdata:
  garagedata:
  garagerun:
  webtmp:
  webrun:
  webssl:
  webnginxtmp:
  webnginxlogs:
  apirun:
  apinginxtmp:
  apinginxlogs:

networks:
  # Frontend: for the published ports of web (80/443) and api
  # This network has access to the host and external networks.
  frontend:
    driver: bridge
  # Backend: internal-only network for DB, Garage, garage-tls, and web.
  # internal:true blocks outbound internet access from this network.
  # SSE-C keys travel over TLS (web → garage-tls :443) — no plaintext on network.
  backend:
    driver: bridge
    internal: true
